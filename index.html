<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Criador de Sites</title>
  </head>
  <body>
    <p class="uptitle">Gerador com Inteligência Artificial</p>

    <h1 id="titleHome">
      Crie sua Página
      <br />
      <span>com um prompt</span>
    </h1>

    <p class="subtitle">
      Descreva o seu negócio e veja a IA criar uma página profissional em
      segundos.
    </p>

    <div class="box-entry">
      <textarea
        class="textUser"
        placeholder="Descreva seu negócio. Ex: Cafeteria, Mercado etc."
      ></textarea>

      <button id="button_generate" onclick="gerarCodigo()">⚡Gerar</button>
    </div>
    <div class="box-result">
      <p class="code-block"></p>

      <iframe class="site-block"></iframe>

      <script src="./script.js"></script>
    </div>
  </body>
</html>
